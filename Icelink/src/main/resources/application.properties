spring.application.name=Icelink

# ---- Datasource (PostgreSQL 18.6) ----
# 비밀값은 환경 변수 또는 application-local.properties(gitignore)에서 주입한다.
spring.datasource.url=jdbc:postgresql://${ICELINK_DB_HOST:fbwoalszz.iptime.org}:${ICELINK_DB_PORT:5432}/${ICELINK_DB_NAME:kosscchthon}
spring.datasource.username=${ICELINK_DB_USER:fbwoals}
spring.datasource.password=${ICELINK_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# ---- JPA ----
# 스키마는 Hibernate 가 엔티티 기준으로 자동 생성/변경한다 (Flyway 미사용, 1인 개발).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---- Actuator ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- Icelink ----
# last_seen_at 갱신 최소 간격
icelink.user.last-seen-throttle=60s

# ---- AI Gateway ----
icelink.ai.base-url=https://ai.cs.kookmin.ac.kr/v1
icelink.ai.model=claude-opus-5
icelink.ai.api-key=${ICELINK_AI_API_KEY}
icelink.ai.connect-timeout=3s
icelink.ai.read-timeout=15s
icelink.ai.max-tokens=700

# ---- Room ----
icelink.room.invite-base-url=https://icelink.app/join
icelink.room.deep-link-prefix=icelink://join?code=
icelink.room.ttl=24h
icelink.ai.temperature=0.8

# ---- Async (AI 호출용) ----
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ai-

# ---- CORS ----
# Flutter 웹 빌드·Swagger 등 브라우저 클라이언트용. 콤마 구분, 기본 전체 허용.
icelink.cors.allowed-origins=*
