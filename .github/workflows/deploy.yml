# main 에 푸시되면: 테스트 → Docker Hub 에 이미지 푸시 → 서버에 SSH 로 접속해 pull & 재시작
# (paths 필터 때문에 Icelink/ 나 이 파일이 바뀐 푸시만 실행된다. 수동 실행은 Actions 탭 → Run workflow)
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   Docker Hub 계정
#   DOCKERHUB_TOKEN      Docker Hub Access Token (Read & Write)
#   SSH_HOST             fbwoalszz.iptime.org
#   SSH_PORT             공유기에서 서버 22 로 포워딩한 외부 포트 (예: 2222)
#   SSH_USER             fbwoals
#   SSH_PASSWORD         SSH 비밀번호 (비밀번호 인증. 러너에서 sshpass 로 전달)
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'Icelink/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/icelink-backend

jobs:
  test:
    name: Gradle test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: Icelink
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  build-push:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Image tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: Icelink
          file: Icelink/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH (password auth)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Pull & restart backend
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p "${{ secrets.SSH_PORT }}" \
              -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=20 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<'EOF'
            set -euo pipefail
            IMAGE="${{ env.IMAGE }}:latest"
            echo "==> pull $IMAGE"
            docker pull "$IMAGE"
            docker rm -f icelink-backend >/dev/null 2>&1 || true
            # 호스트 네트워크: 호스트 PostgreSQL(localhost:5432) 을 그대로 쓰고 8080 을 호스트에 바인딩
            docker run -d --name icelink-backend --restart unless-stopped \
              --network host \
              --env-file /home/fbwoals/icelink.env -e SPRING_PROFILES_ACTIVE=prod \
              --log-opt max-size=20m --log-opt max-file=5 \
              "$IMAGE" >/dev/null
            for i in $(seq 1 30); do
              curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1 && { echo "backend UP"; break; }
              [ "$i" = 30 ] && { echo "backend not healthy"; docker logs --tail 40 icelink-backend; exit 1; }
              sleep 2
            done
            docker image prune -f >/dev/null
            docker ps --filter name=icelink-backend --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          EOF
